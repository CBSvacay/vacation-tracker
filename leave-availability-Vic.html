            "d94e35b866d8d29e":"5b0c5a8f07d53e42fbbe32121c85384d9dc610b65b72fc23bd69d2e1cd934dcb2936c024524d63b3bc3f526226a37a616f45e2bfb6e8052ad4b8daba7794fa5a898b155aff3221d7f1b849b39317a6b4a9c5128bb22c2e6935ddf8919184b981d4e0a582568da5f6aec013d397f8f0f6c5b82644e8ba9f6d5482350be9daf758687b80be5aa96a9429e043806be85c16aee8f76689dddf33b7fbd82c4d6ac534787df1ecc57ad7a0366ab4b3245a87ca216758da28a0d8771fcd14820b5bfcd6e296d106c085f8f206d52a52d076e8614a13d7d2450c1c326c167b5c8ae61b6ecf4bf63259a87ad88ba14181644d0cddb44e1927850bd722009a1ce76558c291cae90ce348ccb33d71c29182817e97925d7d591c218067872030f996911188ce3d6e9886b80b6c6b7db26b74b8ec1a6ead194eb2c892acfaba14e90a6ba2a29cc5b2713f20ae4de9c36d2c17f7cc8ac32931e87c5d82b3eed733eb348723c7791aa787bbf6d8e4b1af6c8fb0ea0a3eed04e41d94c7cfbd7c36fd3c0489e366af9be84a2e6fcc39f895710196319a67"
        }};

    </script>

    <script>
    (function () {
        'use strict';
        const D = (typeof availData !== 'undefined') ? availData : null;
        const app = document.getElementById('app');
        const subEl = document.getElementById('sub');
        const params = new URLSearchParams(window.location.search);
        const code = (params.get('k') || '').trim().toUpperCase();
        const thisFile = (window.location.pathname.split('/').pop()) || 'leave-availability.html';
        const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const MON3 = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const DOW3 = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const ACK_KEY = 'leaveAvailAck';

        function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
        function message(html) { app.innerHTML = '<div class="msg">' + html + '</div>'; }

        if (!D || !D.people) { message('This page hasn&rsquo;t been set up yet. Please try again later.'); return; }
        if (!code) { message('Please open this page from the <b>personal link in your email</b>.<br>If you can&rsquo;t find it, ask your supervisor to send it again.'); return; }
        if (!window.crypto || !window.crypto.subtle) { message('Your browser can&rsquo;t open this page. Please try a different browser, or update this one.'); return; }

        // ---------- weekly disclaimer (renews every Sunday, remembered only on this device) ----------
        function lastSunday() { const t = new Date(); t.setHours(0, 0, 0, 0); t.setDate(t.getDate() - t.getDay()); return t.getTime(); }
        function ackOk() { try { return Number(localStorage.getItem(ACK_KEY) || 0) >= lastSunday(); } catch (e) { return false; } }
        function saveAck() { try { localStorage.setItem(ACK_KEY, String(Date.now())); } catch (e) { } }

        function showDisclaimer() {
            app.innerHTML =
                '<div class="dis"><h2>&#9888; Before you look</h2>' +
                '<p>This page shows <b>estimated</b> staffing for your shifts, based on the posted schedule and the requests already in (approved and pending).</p>' +
                '<ul><li>It is a guide only. It does <b>not</b> guarantee your request will be approved.</li>' +
                '<li>It may not include everything that affects staffing (training, sick calls, operational needs).</li>' +
                '<li>It changes as requests come in, so it may be different by the time your request is reviewed.</li>' +
                '<li>It may not reflect the live schedule. <b>Please check the staffing binder</b> before submitting your request.</li></ul>' +
                '<label class="chk"><input type="checkbox" id="ackBox"><span>I understand this is a live guide only and does not guarantee approval.</span></label>' +
                '<button class="btn" id="ackBtn" disabled>Continue</button>' +
                '<div class="note">You&rsquo;ll be asked again each Sunday.</div></div>';
            const box = document.getElementById('ackBox'), btn = document.getElementById('ackBtn');
            box.addEventListener('change', () => { btn.disabled = !box.checked; });
            btn.addEventListener('click', () => { if (box.checked) { saveAck(); start(); } });
        }

        // ---------- unlock this person's part with their code (SHA-256 keystream, same as the Excel program) ----------
        const enc = new TextEncoder();
        async function sha(bytes) { return new Uint8Array(await crypto.subtle.digest('SHA-256', bytes)); }
        function hex(b) { return Array.from(b, x => x.toString(16).padStart(2, '0')).join(''); }
        async function unlock() {
            const id = hex(await sha(enc.encode('id:' + code))).slice(0, 16);
            const blob = D.people[id];
            if (!blob) return null;
            // blob = 16-byte random nonce (hex) + locked text (hex)
            const key = await sha(enc.encode('key:' + code));
            const n = blob.length / 2 - 16, out = new Uint8Array(n), blk = new Uint8Array(52);
            blk.set(key, 0);
            for (let j = 0; j < 16; j++) blk[32 + j] = parseInt(blob.substr(j * 2, 2), 16);
            let ks = null;
            for (let i = 0; i < n; i++) {
                if (i % 32 === 0) {
                    const ctr = i / 32;
                    blk[48] = (ctr >>> 24) & 255; blk[49] = (ctr >>> 16) & 255; blk[50] = (ctr >>> 8) & 255; blk[51] = ctr & 255;
                    ks = await sha(blk);
                }
                out[i] = parseInt(blob.substr(32 + i * 2, 2), 16) ^ ks[i % 32];
            }
            let text = '';
            for (let i = 0; i < n; i++) text += String.fromCharCode(out[i]);
            if (text.slice(0, 3) !== 'OK|') return null;
            const parts = text.split('|');
            const runs = (parts[3] || '').split(';').filter(x => x).map(x => {
                const a = x.split(',');
                return { s: +a[0], e: +a[1], st: a[2], kind: a[3], tm: a[4] || '' };
            });
            return { union: parts[1], days: parts[2], runs: runs };
        }

        // ---------- calendar ----------
        let P = null, U = null, month = 0, selIdx = -1;
        const year = D.year;
        const y0 = Date.UTC(year, 0, 1);
        const idxOf = (y, m, d) => Math.round((Date.UTC(y, m, d) - y0) / 86400000);
        const dateOf = i => new Date(year, 0, 1 + i);
        const longDate = d => DOW3[d.getDay()] + ' ' + MON3[d.getMonth()] + ' ' + d.getDate();
        const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        const now = new Date();
        const todayIdx = idxOf(now.getFullYear(), now.getMonth(), now.getDate());
        const LEVEL = { g: ['g', 'Good', 'room above the minimum'], y: ['y', 'Limited', 'one more off reaches the minimum'],
                        r: ['r', 'At or below minimum', 'no room right now'], n: ['n', 'No minimum set', ''] };

        function formLink(dateStr) {
            let u = (D.form || 'leave-request-form.html') + '?year=' + year + '&k=' + encodeURIComponent(code) + '&src=' + encodeURIComponent(thisFile);
            if (dateStr) u += '&date=' + dateStr;
            return u;
        }

        function dayInfo(i) {
            // returns {cls, label, text, canRequest}
            const ch = P.days.charAt(i);
            if (ch >= '0' && ch <= '4') {
                const L = +ch;
                let lv = (U && U.lv && U.lv[L]) ? U.lv[L] : '';
                if (!lv && U && U.lv) lv = U.lv[0] || '';
                const lc = lv.charAt(i) || '-';
                const loc = (L > 0 && U && U.locs && U.locs[L]) ? U.locs[L] : '';
                const where = loc ? 'working at ' + loc : 'working';
                if (lc === 'c') return { cls: 'c', label: 'closed', text: 'closed', canRequest: false };
                if (LEVEL[lc]) {
                    const v = LEVEL[lc];
                    return { cls: v[0], label: loc || v[1], text: where + ' - <b>' + v[1] + '</b>' + (v[2] ? ' (' + v[2] + ')' : ''), canRequest: true };
                }
                return { cls: 'n', label: loc || 'work', text: where, canRequest: true };
            }
            switch (ch) {
                case 'A': return { cls: 'mine', label: 'leave', text: 'your leave - <b>approved</b>', canRequest: false };
                case 'P': return { cls: 'pend', label: 'pending', text: 'your leave - <b>pending</b>', canRequest: false };
                case 'a': return { cls: 'mine', label: 'part', text: 'your partial-day leave - <b>approved</b>', canRequest: false };
                case 'p': return { cls: 'pend', label: 'part', text: 'your partial-day leave - <b>pending</b>', canRequest: false };
                case '.': return { cls: 'o', label: 'off', text: 'your day off', canRequest: false };
                case 'c': return { cls: 'c', label: '', text: 'closed', canRequest: false };
                case 's': return { cls: 's', label: 'STAT', text: 'STAT holiday', canRequest: false };
                case 'f': return { cls: 'f', label: 'office', text: 'office day', canRequest: true };
                default: return { cls: 'none', label: '', text: 'not on the schedule yet', canRequest: false };
            }
        }

        function render() {
            const first = new Date(year, month, 1).getDay();
            const nd = new Date(year, month + 1, 0).getDate();
            let h = '<div class="nav"><button id="prev">&larr;</button><span>' + MONTHS[month] + ' ' + year + '</span><button id="next">&rarr;</button></div>';
            h += '<div class="cal">' + ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(x => '<div class="dh">' + x + '</div>').join('');
            for (let k = 0; k < first; k++) h += '<div></div>';
            for (let d = 1; d <= nd; d++) {
                const i = idxOf(year, month, d);
                let info = dayInfo(i);
                let cls = info.cls;
                if (i < todayIdx && cls !== 'mine' && cls !== 'pend') cls = 'p';
                h += '<div class="d ' + cls + (i === selIdx ? ' sel' : '') + '" data-i="' + i + '"><b>' + d + '</b><small>' + esc(cls === 'p' ? '' : info.label) + '&nbsp;</small></div>';
            }
            h += '</div>';
            h += '<div class="legend">' +
                '<span><span class="sw g"></span>Good</span><span><span class="sw y"></span>Limited</span><span><span class="sw r"></span>At/below minimum</span>' +
                '<span><span class="sw mine"></span>Your leave (approved)</span><span><span class="sw pend"></span>Pending</span>' +
                '<span><span class="sw o"></span>Day off</span><span><span class="sw c"></span>Closed</span><span><span class="sw p"></span>Past</span></div>';
            h += '<div class="detail" id="detail"></div>';
            h += requestsHtml();
            h += '<a class="btn" href="' + esc(formLink('')) + '">Make a leave request</a>';
            h += '<div class="foot">Last updated: ' + esc(D.updated || '') + ' &middot; Only you have this link</div>';
            app.innerHTML = h;
            document.getElementById('prev').disabled = (month === 0);
            document.getElementById('next').disabled = (month === 11);
            document.getElementById('prev').onclick = () => { if (month > 0) { month--; selIdx = -1; render(); } };
            document.getElementById('next').onclick = () => { if (month < 11) { month++; selIdx = -1; render(); } };
            app.querySelectorAll('.d[data-i]').forEach(el => el.onclick = () => { selIdx = +el.dataset.i; render(); showDetail(selIdx); });
            if (selIdx >= 0) showDetail(selIdx);
        }

        function showDetail(i) {
            const box = document.getElementById('detail');
            const info = dayInfo(i);
            const d = dateOf(i);
            let h = '<b>' + longDate(d) + '</b> &middot; ' + info.text;
            if (i < todayIdx) h += '<br><span style="color:#6c757d">This day has passed.</span>';
            else if (info.canRequest) h += '<a class="btn small" href="' + esc(formLink(ymd(d))) + '">Request this day &rsaquo;</a>';
            box.innerHTML = h;
            box.style.display = 'block';
        }

        function rangeText(s, e) {
            const a = dateOf(s), b = dateOf(e);
            if (s === e) return MON3[a.getMonth()] + ' ' + a.getDate();
            if (a.getMonth() === b.getMonth()) return MON3[a.getMonth()] + ' ' + a.getDate() + ' - ' + b.getDate();
            return MON3[a.getMonth()] + ' ' + a.getDate() + ' - ' + MON3[b.getMonth()] + ' ' + b.getDate();
        }

        function requestsHtml() {
            let h = '<h3>My requests in ' + year + '</h3>';
            if (!P.runs.length) return h + '<div class="note">No leave or vacation on the schedule for ' + year + ' yet.</div>';
            P.runs.forEach(r => {
                const what = r.kind === 'V' ? 'Annual vacation' : 'Leave';
                const tm = r.tm ? ' &middot; ' + esc(r.tm.replace('-', ' - ')) : '';
                const pill = r.st === 'P' ? '<span class="pill pp">Pending</span>' : '<span class="pill pa">Approved</span>';
                h += '<div class="req' + (r.e < todayIdx ? ' past' : '') + '"><span><b>' + rangeText(r.s, r.e) + '</b> &middot; ' + what + tm + '</span>' + pill + '</div>';
            });
            return h;
        }

        async function start() {
            message('Opening your availability...');
            let p = null;
            try { p = await unlock(); } catch (e) { p = null; }
            if (!p) {
                subEl.innerHTML = '&nbsp;';
                message('This link isn&rsquo;t valid (it may have been replaced).<br>Please ask your supervisor to send you a new one.');
                return;
            }
            P = p;
            U = (D.unions && D.unions[P.union]) ? D.unions[P.union] : null;
            subEl.textContent = 'Union ' + P.union + ' ' + String.fromCharCode(183) + ' ' + year;
            month = (now.getFullYear() === year) ? now.getMonth() : 0;
            render();
        }

        if (ackOk()) start(); else showDisclaimer();
    })();
    </script>
